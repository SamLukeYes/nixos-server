name: Flake check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'flake.lock'

jobs:
  flake-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Set up Nix
        uses: cachix/install-nix-action@v31

      - name: Cachix
        uses: cachix/cachix-action@v17
        with:
          name: samlukeyes123
          extraPullNames: nix-community
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Flake check
        run: |
          nix flake check
